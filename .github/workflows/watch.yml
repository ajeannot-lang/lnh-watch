name: Surveillance calendriers LNH

on:
  schedule:
       - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lnh-watch
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Vérifier les calendriers
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SITE_URL:  ${{ secrets.SITE_URL }}
          LNH_DEBUG: "1"
        run: python scraper.py

      - name: Publier la mise à jour
        run: |
          git config user.name  "lnh-watch-bot"
          git config user.email "actions@github.com"
          git add -A docs data
          if git diff --cached --quiet; then
            echo "Rien à mettre à jour."
          else
            git commit -m "Mise a jour calendriers"
            git push
          fi
